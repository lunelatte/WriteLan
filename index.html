<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WriteLan</title>
    <!-- ลิงก์เรียกไฟล์ Manifest (สำหรับ Android / PWA ทั่วไป) -->
    <link rel="manifest" href="manifest.json">
    <!-- ลิงก์ไอคอนสำหรับ iPhone / iPad (iOS) -->
    <link rel="apple-touch-icon" href="artworks/icon_web.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <div class="main-scroll-area">
            
            <!-- 1. แบนเนอร์รูปภาพด้านบน -->
            <header class="hero-banner">
                <img src="artworks/home-bg.png" alt="WriteLan Banner" class="banner-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'250\'><rect width=\'100%\' height=\'100%\' fill=\'%23e0f2fe\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'0369a1\' font-family=\'sans-serif\' font-size=\'16px\'>กรุณาตรวจสอบชื่อไฟล์ home-bg.png</text></svg>'">
            </header>

            <!-- 2. เมนูทางลัด 4 ปุ่ม (เปลี่ยนเป็นรูปไอคอนพิกเซลจากโฟลเดอร์ artworks) -->
            <section class="quick-menu">
                <button class="menu-card" onclick="selectMenu('หมวดหมู่')">
                    <div class="icon-box">
                        <img src="artworks/icon_book.png" alt="หมวดหมู่" class="pixel-menu-icon">
                    </div>
                    <span>หมวดหมู่</span>
                </button>

                <button class="menu-card" onclick="selectMenu('จัดอันดับ')">
                    <div class="icon-box">
                        <img src="artworks/icon_trophy.png" alt="จัดอันดับ" class="pixel-menu-icon">
                    </div>
                    <span>จัดอันดับ</span>
                </button>

                <button class="menu-card" onclick="selectMenu('ใหม่ล่าสุด')">
                    <div class="icon-box">
                        <img src="artworks/icon_energy.png" alt="ใหม่ล่าสุด" class="pixel-menu-icon">
                    </div>
                    <span>ใหม่ล่าสุด</span>
                </button>

                <button class="menu-card" onclick="selectMenu('กิจกรรม')">
                    <div class="icon-box">
                        <img src="artworks/icon_gift.png" alt="กิจกรรม" class="pixel-menu-icon">
                    </div>
                    <span>กิจกรรม</span>
                </button>
            </section>

            <!-- 3. ส่วนหมวดหมู่ "ใหม่มาแรง" -->
            <section class="novel-section">
                <div class="section-header">
                    <h2>🔥 ใหม่มาแรง</h2>
                    <a href="#" class="view-all">ดูทั้งหมด &gt;</a>
                </div>

                <div class="featured-card" id="featured-novel">
                    <div class="novel-cover-placeholder">
                        <span>ปกนิยาย</span>
                    </div>
                    <div class="novel-info">
                        <h3 class="novel-title">หัวใจดวงนี้มีแค่เธอ</h3>
                        <p class="novel-desc">เมื่อโชคชะตาพาให้เรากลับมาเจอกันอีกครั้ง... ในวันที่ทุกอย่างเปลี่ยนไป</p>
                        <div class="novel-meta">
                            <span class="likes">♡ 392K</span>
                            <span class="genre-tag">โรแมนติก</span>
                        </div>
                    </div>
                </div>

                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </section>

        </div>

        <!-- 4. แถบเมนูด้านล่าง -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab(this, 'หน้าแรก')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>หน้าแรก</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'แฟนฟิคชั่น')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>แฟนฟิคชั่น</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'คลังของฉัน')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>คลังของฉัน</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'นักเขียน')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.5 7.5"></path>
                    <path d="M11.5 12.5l3 3"></path>
                </svg>
                <span>นักเขียน</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'บัญชี')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>บัญชี</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
