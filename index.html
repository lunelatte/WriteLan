<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- เพิ่ม viewport-fit=cover เพื่อให้เว็บขยายทะลุขอบบนสุดได้ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- สั่งให้แถบสถานะด้านบนของ iOS โปร่งใส -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>WriteLan - Pixel Novel PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- 1. หน้าแรก (Welcome Screen) แสดงภาพพิกเซล เมื่อคลิกที่รูปจะเข้าแอป -->
    <div id="welcome-screen" class="screen">
        <div class="welcome-content" id="welcome-click-area" style="cursor: pointer;">
            <img src="artworks/welcome-bg.png" alt="WriteLan Pixel Art" class="welcome-img">
        </div>
    </div>

    <!-- 2. หน้าหลักของแอป (ซ่อนไว้ก่อนจนกว่าจะล็อกอินสำเร็จ) -->
    <div id="main-app-screen" class="screen" style="display: none;">
        <header>
            <h1>📖 WriteLan Pixel Novel</h1>
            <div id="auth-container">
                <button id="logout-btn" class="pixel-btn-small">ออกจากระบบ</button>
            </div>
        </header>

        <main>
            <section id="novel-list-section">
                <h2>ชั้นหนังสือนิยาย</h2>
                <div id="novels-container">
                    <!-- รายการนิยายจะแสดงที่นี่ -->
                </div>
            </section>
        </main>
    </div>

    <!-- เชื่อมต่อไฟล์ JavaScript หลัก -->
    <script type="module" src="app.js"></script>
</body>
</html>
