<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WriteLan - อ่าน เก็บ แชร์ เรื่องราวดีๆ ไปด้วยกัน</title>
    <!-- โหลดฟอนต์ภาษาไทยอ่านง่าย สบายตา -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">
        <!-- พื้นที่เนื้อหาหลัก (เลื่อนขึ้นลงได้) -->
        <div class="main-scroll-area">
            
            <!-- 1. แบนเนอร์รูปภาพด้านบน -->
            <header class="hero-banner">
                <img src="artworks/home-bg.png" alt="WriteLan Banner" class="banner-img">
            </header>

            <!-- 2. เมนูทางลัด 4 ปุ่ม -->
            <section class="quick-menu">
                <button class="menu-card" onclick="selectMenu('หมวดหมู่')">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                        </svg>
                    </div>
                    <span>หมวดหมู่</span>
                </button>

                <button class="menu-card" onclick="selectMenu('จัดอันดับ')">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                        </svg>
                    </div>
                    <span>จัดอันดับ</span>
                </button>

                <button class="menu-card" onclick="selectMenu('ใหม่ล่าสุด')">
                    <span class="badge-new">NEW</span>
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                    </div>
                    <span>ใหม่ล่าสุด</span>
                </button>

                <button class="menu-card" onclick="selectMenu('กิจกรรม')">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 12 20 22 4 22 4 12"></polyline>
                            <rect x="2" y="7" width="20" height="5"></rect>
                            <line x1="12" y1="22" x2="12" y2="7"></line>
                            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                        </svg>
                    </div>
                    <span>กิจกรรม</span>
                </button>
            </section>

            <!-- 3. หมวดหมู่ แฟนฟิคชั่น -->
            <section class="novel-section">
                <div class="section-header">
                    <h2>🔥 แฟนฟิคชั่น</h2>
                    <a href="#" class="view-all">ดูทั้งหมด &gt;</a>
                </div>

                <!-- การ์ดนิยายแนะนำ -->
                <div class="featured-card" id="featured-novel">
                    <div class="novel-cover-placeholder">
                        <span>ปกนิยาย</span>
                    </div>
                    <div class="novel-info">
                        <h3 class="novel-title">หัวใจดวงนี้มีแค่เธอ</h3>
                        <p class="novel-desc">เมื่อโชคชะตาพาให้เรากลับมาเจอกันอีกครั้ง... ในวันที่ทุกอย่างเปลี่ยนไป</p>
                        <div class="novel-meta">
                            <span class="likes">♡ 392K</span>
                            <span class="genre-tag">แฟนฟิคชั่น</span>
                        </div>
                    </div>
                </div>

                <!-- จุดไข่ปลาบอกหน้าสไลด์ -->
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </section>

        </div>

        <!-- 4. แถบเมนูนำทางด้านล่าง (Bottom Navigation) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab(this, 'หน้าแรก')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>หน้าแรก</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'หมวดหมู่')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                </svg>
                <span>หมวดหมู่</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'คลังของฉัน')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>คลังของฉัน</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'รายการโปรด')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <span>รายการโปรด</span>
            </button>

            <button class="nav-item" onclick="switchTab(this, 'บัญชี')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>บัญชี</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
