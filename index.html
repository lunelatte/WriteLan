<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" id="meta-theme-color" content="#f2fbfa">
    <title>WriteLan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="artworks/icon_web.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-teal">

    <div id="app-container">
        
        <!-- แถบบนสุด (ชื่อเว็บ + เมนูด้านขวา: ค้นหา, เปลี่ยนธีม, แจ้งเตือน) -->
        <header class="top-nav-bar">
            <div class="brand-title">WriteLan</span></div>
            <div class="top-actions">
                <button class="action-btn" onclick="openSearch()" title="ค้นหา">
                    <img src="artworks/icon_search.png" alt="Search" class="top-icon">
                </button>
                <!-- ปุ่มเปลี่ยนธีม (คลิกเพื่อวนลูปเปลี่ยน 4 โหมด) -->
                <button class="action-btn" id="theme-toggle-btn" onclick="cycleTheme()" title="เปลี่ยนธีม">
                    <span id="theme-icon">☁️</span>
                </button>
                <button class="action-btn" onclick="openNotifications()" title="แจ้งเตือน">
                    <img src="artworks/icon_bell.png" alt="Notifications" class="top-icon">
                </button>
            </div>
        </header>

        <div class="main-scroll-area">
            
            <!-- === ส่วนที่ 1: หน้าแรก (Home Content) === -->
            <div id="home-page-content">
                <!-- แบนเนอร์สไลด์ -->
                <section class="banner-slider-container">
                    <div class="slider-track" id="bannerTrack">
                        <div class="slide-item"><img src="artworks/cozycat.png" alt="Banner 1"></div>
                        <div class="slide-item"><img src="artworks/bg1.png" alt="Banner 2"></div>
                        <div class="slide-item"><img src="artworks/bg2.png" alt="Banner 3"></div>
                    </div>
                    <div class="banner-dots" id="bannerDots">
                        <span class="b-dot active" onclick="currentSlide(0)"></span>
                        <span class="b-dot" onclick="currentSlide(1)"></span>
                        <span class="b-dot" onclick="currentSlide(2)"></span>
                    </div>
                </section>

                <!-- เมนูทางลัด 4 ปุ่ม -->
                <section class="quick-menu">
                    <button class="menu-card" onclick="selectMenu('หมวดหมู่')">
                        <div class="icon-box"><img src="artworks/icon_book.png" alt="หมวดหมู่" class="pixel-menu-icon"></div>
                        <span>หมวดหมู่</span>
                    </button>
                    <button class="menu-card" onclick="selectMenu('จัดอันดับ')">
                        <div class="icon-box"><img src="artworks/icon_trophy.png" alt="จัดอันดับ" class="pixel-menu-icon"></div>
                        <span>จัดอันดับ</span>
                    </button>
                    <button class="menu-card" onclick="selectMenu('ใหม่ล่าสุด')">
                        <span class="badge-new">NEW</span>
                        <div class="icon-box"><img src="artworks/icon_star.png" alt="ใหม่ล่าสุด" class="pixel-menu-icon"></div>
                        <span>ใหม่ล่าสุด</span>
                    </button>
                    <button class="menu-card" onclick="selectMenu('กิจกรรม')">
                        <div class="icon-box"><img src="artworks/icon_gift.png" alt="กิจกรรม" class="pixel-menu-icon"></div>
                        <span>กิจกรรม</span>
                    </button>
                </section>

                <!-- นิยายแนะนำ -->
                <section class="novel-section">
                    <div class="section-header">
                        <h2><img src="artworks/icon_star.png" alt="Star" class="section-heading-icon"> นิยายแนะนำ</h2>
                        <a href="#" class="view-all">ดูทั้งหมด &gt;</a>
                    </div>
                    <div class="featured-card">
                        <div class="novel-cover-placeholder" style="background: linear-gradient(135deg, #a5f3fc 0%, #38bdf8 100%);"><span>ปก 1</span></div>
                        <div class="novel-info">
                            <h3 class="novel-title">พ่ายรักมาเฟียร้าย</h3>
                            <p class="novel-desc">เมื่อความรักต้องแลกด้วยหัวใจของเธอเอง...</p>
                            <div class="novel-meta"><span class="likes">♡ 510K</span><span class="genre-tag">โรแมนติก</span></div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- === ส่วนที่ 2: หน้าบัญชี (Profile Page) === -->
            <div id="profile-page" class="page-view" style="display: none;">
                <!-- 1. ข้อมูลโปรไฟล์ส่วนตัว -->
                <div class="profile-header-card">
                    <div class="profile-avatar-box">
                        <img src="artworks/icon_proflie.png" alt="Profile" class="profile-avatar-img">
                    </div>
                    <div class="profile-user-info">
                        <h2 class="profile-display-name">นักอ่านของ WriteLan</h2>
                        <span class="profile-username">@writelan_reader</span>
                    </div>
                </div>

                <!-- 2. กล่องสถิติ -->
                <div class="profile-stats-card">
                    <div class="stat-item">
                        <div class="stat-icon-box"><img src="artworks/icon_book.png" alt="นิยายที่อ่าน" class="pixel-stat-icon"></div>
                        <span class="stat-number">356</span>
                        <span class="stat-label">นิยายที่อ่าน</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon-box"><img src="artworks/icon_heart.png" alt="รายการโปรด" class="pixel-stat-icon"></div>
                        <span class="stat-number">128</span>
                        <span class="stat-label">รายการโปรด</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon-box"><img src="artworks/icon_medal.png" alt="เหรียญตรา" class="pixel-stat-icon"></div>
                        <span class="stat-number">42</span>
                        <span class="stat-label">เหรียญตรา</span>
                    </div>
                </div>

                <!-- 3. แบนเนอร์กิจกรรมพิเศษ -->
                <div class="special-event-banner" onclick="openProfileDetail()">
                    <div class="event-left">
                        <img src="artworks/cozycat.png" alt="Special Event" class="event-cat-img">
                        <div class="event-text">
                            <h4>กิจกรรมพิเศษ</h4>
                            <p>สะสมแต้ม รับรางวัลสุดพิเศษ!</p>
                        </div>
                    </div>
                    <div class="event-right">
                        <span>โปรไฟล์ของคุณ &gt;</span>
                    </div>
                </div>

                <!-- 4. รายการเมนูหลัก -->
                <div class="profile-menu-list">
                    <button class="profile-menu-item" onclick="openMenuAction('เหรียญของฉัน')">
                        <div class="menu-item-left"><span class="menu-item-icon">🪙</span><span>เหรียญของฉัน</span></div>
                        <span class="arrow">&gt;</span>
                    </button>
                    <button class="profile-menu-item" onclick="openMenuAction('ประวัติการซื้อ')">
                        <div class="menu-item-left"><span class="menu-item-icon">📦</span><span>ประวัติการซื้อ</span></div>
                        <span class="arrow">&gt;</span>
                    </button>
                    <button class="profile-menu-item" onclick="openMenuAction('ตั้งค่าแอปพลิเคชั่น')">
                        <div class="menu-item-left"><span class="menu-item-icon">⚙️</span><span>ตั้งค่าแอปพลิเคชั่น</span></div>
                        <span class="arrow">&gt;</span>
                    </button>
                    <button class="profile-menu-item" onclick="openMenuAction('ตั้งค่าการแจ้งเตือน')">
                        <div class="menu-item-left"><span class="menu-item-icon">🔔</span><span>ตั้งค่าการแจ้งเตือน</span></div>
                        <span class="arrow">&gt;</span>
                    </button>
                    <button class="profile-menu-item" onclick="openMenuAction('ติดต่อเรา')">
                        <div class="menu-item-left"><span class="menu-item-icon">✉️</span><span>ติดต่อเรา</span></div>
                        <span class="arrow">&gt;</span>
                    </button>
                </div>

                <!-- 5. ปุ่มออกจากระบบ -->
                <div class="logout-container">
                    <button class="logout-btn" onclick="handleLogout()">ออกจากระบบ</button>
                </div>
            </div>

        </div>
