<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WriteLan - Pixel Novel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- หน้าแรกของแอป (แสดงผลทันทีที่เปิดเว็บ รองรับทั้งมือถือและคอม) -->
    <div id="app-container">
        <header class="app-header">
            <h1>📖 WriteLan Pixel Novel</h1>
            <p>ยินดีต้อนรับสู่นิยายพิกเซลของคุณ</p>
        </header>

        <main class="app-main">
            <section class="book-shelf">
                <h2>ชั้นหนังสือนิยาย</h2>
                <div id="novels-list">
                    <!-- รายการนิยายจะแสดงที่นี่ -->
                    <p class="loading-text">กำลังโหลดชั้นหนังสือ...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- เชื่อมต่อระบบ JavaScript และ Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
